name: Simulator and learner correctness
on: [push, pull_request, workflow_dispatch]
jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.11.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      # Logs need sign-in on GitHub; annotations are public, so the pytest tail is published as one.
      - run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest.log
      - if: failure()
        run: |
          msg=$(grep -E "^(FAILED|ERROR)|Error|Interrupted|passed|failed" pytest.log | tail -n 40 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=pytest summary::$msg"
