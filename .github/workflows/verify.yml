name: Simulator and learner correctness
on: [push, pull_request, workflow_dispatch]
jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.11.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      # Logs need sign-in on GitHub; the job summary is public, so failures stay diagnosable.
      - run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest.log
      - if: always()
        run: { echo '```'; tail -n 60 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
